appId: com.nousresearch.hermes
productName: Hermes Agent
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  # `!src/*` only matched files directly under src/, so src/main/**,
  # src/renderer/** and src/preload/** were still packaged alongside the
  # built output in out/.
  - "!src/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # Repository directories that are build- or development-time only. These
  # were all shipping inside app.asar: 55 test files, the Next.js marketing
  # site, README screenshots, and — the reason this is a security fix rather
  # than a size one — `claudedocs/`, which carries internal engineering notes
  # and a security document naming this app's own unfixed weaknesses. None of
  # them is referenced at runtime; the `scripts/` the main process does load
  # live under `resources/pii-gateway/`, which stays.
  - "!{tests,docs,claudedocs,previews,changelogs,scripts,web}/**"
  - "!{.github,.husky,.claude,.agents}/**"
  # CLAUDE.md describes the architecture and names the security-sensitive
  # modules — repo guidance, not something to hand to end users.
  - "!{CONTRIBUTING.md,CONTRIBUTING.zh-CN.md,README.zh-CN.md,CLAUDE.md}"
  - "!{.browserslistrc,.gitattributes,skills-lock.json,vitest.config.ts}"
  # LICENSE stays: upstream is MIT and the notice must travel with copies.
asarUnpack:
  - resources/**
win:
  executableName: hermes-agent
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: Nous Research
  category: Utility
  synopsis: Self-improving AI assistant desktop app
  description: >-
    Hermes Desktop is a native desktop app for installing, configuring, and chatting
    with Hermes Agent — a self-improving AI assistant with tool use, multi-platform
    messaging, and a closed learning loop.
appImage:
  artifactName: ${name}-${version}.${ext}
rpm:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: kos2001
  repo: hermes-desktop-release
